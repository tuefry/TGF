    <section
      class="calendar-section"
      id="kalender"

    >
      <div class="shell">
        <div class="section-heading">
          <div>
            <p class="eyebrow orange">Priser</p>
            <h2 id="calendar-section-title">
              Medlemskab<br /><em>af TGF Dragons Basketball klub</em>
            </h2>
          </div>
          <p>
            Se vores priser for medlemskab.
          </p>
        </div>
        <table id="membership-table" class="pricing-table">
          <thead></thead>
          <tbody></tbody>
        </table>
        <p id="table-error" style="display:none; color: var(--blue); margin-top: 1rem;"></p>

        <script>
          // Paste your published Sheet1 CSV link here:
          // Format: /pub?gid=0&single=true&output=csv  (NOT /pubhtml)
          const sheetCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQOqhausomQGS9IaWlnnoC4yeirfFJ8JQPYx-obwhMYZVA0ND_fW1lja-cGoA6JZEdkAXMRxv2cB4PA/pub?gid=0&single=true&output=csv';

          const tableHead = document.querySelector('#membership-table thead');
          const tableBody = document.querySelector('#membership-table tbody');
          const errorEl = document.querySelector('#table-error');

          fetch(sheetCsvUrl)
            .then(response => {
              if (!response.ok) throw new Error('Network response was not ok');
              return response.text();
            })
            .then(csvText => {
              // Split rows by newline
              const lines = csvText.trim().split(/\r?\n/);
              
              // Parse CSV cells (handles quoted values with commas)
              const rows = lines.map(line => {
                const cells = [];
                let current = '';
                let inQuotes = false;
                
                for (let i = 0; i < line.length; i++) {
                  const char = line[i];
                  if (char === '"') {
                    if (inQuotes && line[i + 1] === '"') {
                      current += '"';
                      i++;
                    } else {
                      inQuotes = !inQuotes;
                    }
                  } else if (char === ',' && !inQuotes) {
                    cells.push(current);
                    current = '';
                  } else {
                    current += char;
                  }
                }
                cells.push(current);
                return cells;
              });

              // Build Headers
              const headers = rows[0];
              let headerHtml = '<tr>';
              headers.forEach(header => {
                const cleanHeader = header.replace(/^"|"$/g, '').trim();
                headerHtml += `<th>${cleanHeader}</th>`;
              });
              headerHtml += '</tr>';
              tableHead.innerHTML = headerHtml;

              // Build Rows
              let bodyHtml = '';
              for (let i = 1; i < rows.length; i++) {
                if (rows[i].length === 0) continue;
                bodyHtml += '<tr>';
                rows[i].forEach(cell => {
                  const cleanCell = cell.replace(/^"|"$/g, '').trim();
                  bodyHtml += `<td>${cleanCell}</td>`;
                });
                bodyHtml += '</tr>';
              }
              tableBody.innerHTML = bodyHtml;
            })
            .catch(error => {
              console.error('Error loading pricing data:', error);
              errorEl.textContent = 'Kunne ikke indlæse priser. Sørg for at Google Sheet er publiceret som CSV (Fil > Del > Publicér på webben > CSV-format).';
              errorEl.style.display = 'block';
            });
        </script>

        <!-- If above script doesn't work try this iframe solution -->

            width="100%" 
            height="400" 
            style="border: none;">
          ></iframe>
        </div> -->

      </div>
