name: Sync Calendars

permissions:
  contents: write

on:
  schedule:
    - cron: '0 * * * *'   # every hour
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Download and sanitize ICS feeds
        run: |
          mkdir -p data
          curl -fsSL 'https://www.holdsport.dk/activities.ics?hide_pickup_time=true&team_id=152179&token=n2qwTKw4M5%2FgBeP4Z%2BsiTw%3D%3D&v=1' \
            | awk '/^ATTENDEE/{skip=1;next} skip && /^[ \t]/{next} {skip=0;print}' > data/team1.ics
          curl -fsSL 'https://www.holdsport.dk/activities.ics?hide_pickup_time=true&team_id=287037&token=VzWMH5NTYrT5dnTzZyTvew%3D%3D&v=1' \
            | awk '/^ATTENDEE/{skip=1;next} skip && /^[ \t]/{next} {skip=0;print}' > data/team2.ics
          # Add team 3 later by uncommenting below:
          # curl -fsSL 'LINK3' | awk '/^ATTENDEE/{skip=1;next} skip && /^[ \t]/{next} {skip=0;print}' > data/team3.ics

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No calendar changes"
          else
            git commit -m "chore: sync calendars $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
