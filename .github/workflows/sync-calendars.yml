name: Sync Calendars

permissions:
  contents: write

on:
  schedule:
    - cron: '0 * * * *'   # every hour
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Fetch and convert ICS feeds to clean JSON
        run: |
          mkdir -p data
          python3 - << 'EOF'
          import json
          import urllib.request
          from datetime import datetime

          FEEDS = [
              {
                  "team": "U9/U11",
                  "color": "#d9232e",
                  "url": "https://holdsport.dk"
              },
              {
                  "team": "U13",
                  "color": "#1e293b",
                  "url": "https://holdsport.dk"
              }
              # Add team 3 here later:
              # {
              #     "team": "Team 3",
              #     "color": "#eab308",
              #     "url": "LINK3"
              # }
          ]

          def parse_ical_dt(val):
              val = val.strip()
              if len(val) == 8:  # YYYYMMDD (all-day)
                  return f"{val[:4]}-{val[4:6]}-{val[6:8]}", True
              # YYYYMMDDTHHMMSSZ or YYYYMMDDTHHMMSS
              dt_str = f"{val[:4]}-{val[4:6]}-{val[6:8]}T{val[9:11]}:{val[11:13]}:{val[13:15]}"
              if val.endswith("Z"):
                  dt_str += "Z"
              return dt_str, False

          def unescape_ics(text):
              return (text.replace("\\,", ",")
                          .replace("\\;", ";")
                          .replace("\\n", " ")
                          .replace("\\N", " ")
                          .replace("\\\\", "\\")
                          .strip())

          all_events = []

          for feed in FEEDS:
              req = urllib.request.urlopen(feed["url"], timeout=30)
              raw = req.read().decode("utf-8", errors="replace")

              # Unfold RFC 5545 folded lines (CRLF/LF followed by space or tab)
              raw = raw.replace("\r\n", "\n").replace("\r", "\n")
              unfolded = []
              for line in raw.split("\n"):
                  if line.startswith((" ", "\t")) and unfolded:
                      unfolded[-1] += line[1:]
                  else:
                      unfolded.append(line)

              in_event = False
              ev = {}
              for line in unfolded:
                  if line == "BEGIN:VEVENT":
                      in_event = True
                      ev = {}
                  elif line == "END:VEVENT" and in_event:
                      in_event = False
                      if "start" in ev:
                          all_events.append({
                              "title": ev.get("summary", "Arrangement"),
                              "start": ev["start"],
                              "end": ev.get("end"),
                              "allDay": ev.get("allDay", False),
                              "url": ev.get("url", ""),
                              "color": feed["color"],
                              "extendedProps": {
                                  "location": ev.get("location", ""),
                                  "team": feed["team"]
                              }
                          })
                  elif in_event and ":" in line:
                      prop, val = line.split(":", 1)
                      prop_name = prop.split(";", 1)[0].upper()
                      if prop_name == "SUMMARY":
                          ev["summary"] = unescape_ics(val)
                      elif prop_name == "LOCATION":
                          ev["location"] = unescape_ics(val)
                      elif prop_name == "URL":
                          ev["url"] = val.strip()
                      elif prop_name == "DTSTART":
                          ev["start"], ev["allDay"] = parse_ical_dt(val)
                      elif prop_name == "DTEND":
                          ev["end"], _ = parse_ical_dt(val)

          with open("data/events.json", "w", encoding="utf-8") as f:
              json.dump(all_events, f, ensure_ascii=False, indent=2)
          EOF

      - name: Remove old raw ICS files if present
        run: rm -f data/team1.ics data/team2.ics data/team3.ics

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No calendar changes"
          else
            git commit -m "chore: sync calendars $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
