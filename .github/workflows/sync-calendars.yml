name: Sync Calendars

permissions:
  contents: write

on:
  schedule:
    - cron: '0 * * * *'   # every hour
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Download ICS feeds
        run: |
          mkdir -p data
          curl -fsSL -o data/team1.ics 'https://holdsport.dk'
          curl -fsSL -o data/team2.ics 'https://holdsport.dk'
          # Add team 3 later:
          # curl -fsSL -o data/team3.ics 'LINK3'

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No calendar changes"
          else
            git commit -m "chore: sync calendars $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
